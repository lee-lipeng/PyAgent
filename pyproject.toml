[project]
name = "pyagent"
version = "0.1.0"
description = "AI Agent 工具包，借鉴 Pi 设计理念"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "lee-lipeng", email = "1640583318@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    # 浏览器桥 (browser_* 工具) 依赖
    "websockets>=12.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
pyagent = "pyagent.cli.app:main"

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"