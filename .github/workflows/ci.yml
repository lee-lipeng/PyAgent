name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run tests
        run: uv run --no-sync pytest -q
      - name: Lint changed core modules
        run: >-
          uv run --no-sync ruff check
          src/pyagent/core/agent.py
          src/pyagent/core/loop.py
          src/pyagent/core/runtime.py
          src/pyagent/core/compaction.py
          src/pyagent/session/store.py
          src/pyagent/tools/schema.py
          src/pyagent/tools/executor.py
          src/pyagent/tools/builtin/bash.py
          src/pyagent/llm/client.py
          src/pyagent/llm/streaming.py
          tests
